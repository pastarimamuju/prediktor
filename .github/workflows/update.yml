name: Update data iklim
on:
  schedule:
    - cron: '0 3 * * *'   # tiap hari 03:00 UTC; BoM memperbarui mingguan, commit hanya bila hasil berubah
  workflow_dispatch:
  push:
    paths: ['Data_Curah_Hujan*.xlsx', 'build_data.py']
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy openpyxl requests
      - run: python build_data.py
        env:
          SHEET_XLSX_URL: ${{ secrets.SHEET_XLSX_URL }}  # opsional
          PERMS: '99'
          PYTHONUNBUFFERED: '1'
      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git add cache 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Update data $(date -u +%F)"
            git pull --rebase
            git push
          fi
